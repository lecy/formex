url: https://lecy.github.io/formex/
destination: docs

# The NODC site style (colours, fonts, navbar, light/dark switch) comes from
# the pkgstyle template package. Do not add bslib settings or
# pkgdown/extra.css here unless this site needs to differ.
template:
  package: pkgstyle

navbar:
  structure:
    left: [intro, overview, articles, reference, news]
  components:
    overview:
      text: Package Overview
      menu:
      - text: Guess Data Type
        href: articles/overview-guess-data-type.html
      - text: The Ontology
        href: articles/overview-ontology.html
      - text: Formatting Syntax
        href: articles/overview-formatting-syntax.html
    articles:
      text: Articles
      menu:
      - text: Guessing a Column's Type
        href: articles/guess-data-type.html
      - text: The Data-Type Ontology
        href: articles/data-type-ontology.html
      - text: "Formex: the format-expression syntax"
        href: articles/formex.html
      - text: How Detectors Recognize a Type
        href: articles/detector-kinds.html
      - text: Data-Type Detector Guide
        href: articles/data-type-detectors.html
      - text: Feature Engineering for Type Guessing
        href: articles/feature-engineering.html
      - text: The Testing Libraries
        href: articles/testing-libraries.html
      - text: Benchmarking and the Stress-Test Design Grid
        href: articles/benchmarking.html
      - text: The Type Atlas
        href: articles/formex-type-atlas.html

reference:
- title: Detect & classify a column
  desc: >
    The primary entry point. Route a column to its ontology type and reconcile
    value- and name-based evidence.
  contents:
  - guess_data_type
  - guess_column
  - score_data_type
  - classify_by_name
  - starts_with("fx_classify")

- title: Stabilize
  desc: Execute an ontology recipe to normalize a column to its stable form.
  contents:
  - fx_stabilize
  - fx_transform

- title: The ontology
  desc: The shared vocabulary of semantic types, plus tooling to audit and evolve it.
  contents:
  - fx_ontology
  - fx_validate_ontology
  - fx_ontology_diff
  - fx_ontology_impact_table
  - fx_impacted_cases
  - fx_migrate_bank
  - fx_relabel_queue
  - fx_dgf_fields
  - fx_triage_field

- title: Column detectors
  desc: >
    Deterministic value predicates, one per format. A column is typed by the
    share of its values a detector accepts.
  contents:
  - starts_with("is_")
  - starts_with("as_")

- title: Feature extraction & signatures
  desc: >
    The value-profile the routers are built on, and the lightweight signature
    primitives derived from it.
  contents:
  - fx_extract_features
  - fx_extract_features_df
  - fx_feature_manifest
  - fx_blocks_for_features
  - default_lexicons
  - fx_type_signature
  - fx_signature_distance
  - fx_path_distance
  - fx_sibling_report
  - SIGNATURE_WEIGHTS
  - WEIGHTS_FORMAT

- title: Test-case bank & auditing
  contents:
  - fx_make_test_case
  - fx_index_bank
  - fx_bank_coverage
  - fx_roundtrip_check
  - fx_audit_ontology

- title: Benchmark & stress-test harness
  desc: >
    Score guess_data_type() over the frozen test library at every ontology level,
    track accuracy and runtime over time, and stress-test robustness with a
    controlled grid of perturbations.
  contents:
  - fx_benchmark_data
  - starts_with("fx_benchmark")
  - fx_coverage_gaps
  - fx_perturb
  - starts_with("fx_stress")
  - fx_contamination_curve

- title: Evaluation & AutoType reporting
  contents:
  - evaluate_columns
  - eval_summary
  - feasibility_score
  - score_feasibility_table
  - starts_with("generate_")
  - starts_with("autotype_")
  - build_autotype_results

- title: Other
  contents:
  - matches(".")

articles:
- title: Package overview
  desc: >
    Start here. Three short tours of what the package does: how it guesses a
    column's type, the shared ontology those types live in, and how it cleans and
    standardizes values.
  navbar: Package Overview
  contents:
  - overview-guess-data-type
  - overview-ontology
  - overview-formatting-syntax
- title: Guides & reference
  desc: Deeper tutorials and the detection/benchmarking internals.
  navbar: Articles
  contents:
  - formex
  - guess-data-type
  - detector-kinds
  - data-type-detectors
  - data-type-ontology
  - feature-engineering
  - testing-libraries
  - benchmarking
  - formex-type-atlas
